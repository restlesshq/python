[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "restless-sdk"
version = "0.1.0"
description = "Capture API traffic and send it to Restless. WSGI and ASGI: Flask, Django, FastAPI, Starlette."
readme = "README.md"
requires-python = ">=3.8"
license = { text = "MIT" }
authors = [{ name = "Restless" }]
keywords = ["restless", "api", "logging", "observability", "wsgi", "asgi", "flask", "fastapi"]
dependencies = []

[project.urls]
Homepage = "https://restless.ai"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
restless = ["py.typed"]
