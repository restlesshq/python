[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "restless-sdk"
version = "0.1.1"
description = "Capture API traffic and send it to Restless. WSGI and ASGI: Flask, Django, FastAPI, Starlette."
readme = "README.md"
requires-python = ">=3.8"
license = { text = "MIT" }
authors = [{ name = "Restless" }]
keywords = ["restless", "api", "logging", "observability", "wsgi", "asgi", "flask", "fastapi"]
dependencies = []

[project.urls]
Homepage = "https://restless.ai"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
# install.md ships INSIDE the package, not just in the sdist. The `api` CLI
# points installing agents at it with
#   python -c "import restless, pathlib; print(pathlib.Path(restless.__file__).parent)"
# and pip installs the wheel, so a root-level file (or a MANIFEST.in entry,
# which only reaches the sdist) would leave that pointer resolving to nothing.
# The Node SDK ships its equivalent the same way, via package.json `files`.
restless = ["py.typed", "install.md"]
