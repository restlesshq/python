name: CI

on:
  push:
    branches: [main]
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: test (python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.8", "3.9", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      # Includes tests/test_vectors.py, which replays the vendored
      # conformance vectors in-process. A Python developer gets a
      # contract failure without needing Node installed.
      - run: PYTHONPATH=src python -m unittest discover -s tests -v

  conformance:
    name: conformance harness
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - uses: actions/setup-node@v4
        with: { node-version: 20.x }

      # META-003: an SDK must run the shared harness against its driver.
      # The harness and vectors live in the Node SDK, the reference
      # implementation. restlesshq/node is public, so the default
      # GITHUB_TOKEN can check it out even from this private repo.
      #
      # This job stays red until the conformance kit lands on node's main
      # branch, because spec/ does not exist there yet. The in-process
      # replay in the `test` job above covers the same vectors meanwhile,
      # from the pinned copy in spec/.
      - name: Check out the reference SDK
        uses: actions/checkout@v4
        with:
          repository: restlesshq/node
          path: .reference

      - name: Replay conformance vectors
        run: |
          PYTHONPATH=src node .reference/spec/harness/run-vectors.mjs \
            --json conformance.json -- python -m restless._conformance

      - name: Differential fuzz against the reference
        run: |
          cd .reference && npm ci && npm run spec:driver && cd ..
          PYTHONPATH=src node .reference/spec/harness/fuzz.mjs \
            --ref "node .reference/spec/driver/.build/node.js" \
            --test "python -m restless._conformance" \
            --iterations 20000

      - uses: actions/upload-artifact@v4
        with:
          name: conformance-report
          path: conformance.json
